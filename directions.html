  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 traffic.html (#content.sub5_1). 슬라이더가 없는 정적 페이지다. -->
        <section id="content" class="sub5_1 sub_traffic">
          <!-- ── 히어로 — 슬라이더가 아닌 고정 배경 ──────────────── -->
          <div class="sub_visual_wide" data-directions-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <strong>LOCATION</strong>
                <p data-directions-hero-description></p>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_location_wrap">
            <div class="inner">
              <ul class="location_box">
                <li>홈</li>
                <li>LOCATION</li>
                <li><a href="./directions.html">오시는 길</a></li>
              </ul>
              <ul class="cate_box">
                <li class="on"><a href="./directions.html">오시는길</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <div class="sub_title_box">
              <h3 data-directions-title></h3>
              <p data-directions-lead></p>
            </div>

            <div class="map_box">
              <!-- 원본은 daum roughmap 퍼가기 스크립트를 넣었다. 업체 고유 key 가
                   필요해 데이터로 만들 수 없어 Kakao Maps SDK 로 대체했다.
                   .map_inner 는 padding-bottom 비율 상자라 #kakao-map 이 absolute 로 채운다. -->
              <div class="map_inner">
                <div id="kakao-map"></div>
              </div>
            </div>

            <div class="map_info inner">
              <strong data-directions-address></strong>
              <dl data-directions-notice></dl>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>
